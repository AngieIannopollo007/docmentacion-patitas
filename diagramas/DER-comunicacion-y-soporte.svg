<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1295" viewBox="0 0 1600 1295"><rect width="100%" height="100%" fill="#ffffff"/><text x="45" y="53" font-family="Arial" font-size="33" font-weight="bold" fill="#000000">PATITAS · DER de acceso, comunicación y moderación</text><polyline points="605,160 230,160 230,360" fill="none" stroke="#000000" stroke-width="3"/><text x="390" y="144" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N</text><polyline points="800,215 800,360" fill="none" stroke="#000000" stroke-width="3"/><text x="810" y="290" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N emisor / receptor</text><polyline points="995,160 1365,160 1365,360" fill="none" stroke="#000000" stroke-width="3"/><text x="1150" y="144" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N</text><polyline points="995,190 1580,190 1580,850 1290,850" fill="none" stroke="#000000" stroke-width="3"/><text x="1390" y="720" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N avisos</text><polyline points="800,515 800,650 990,650 990,750" fill="none" stroke="#000000" stroke-width="3"/><text x="760" y="629" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N vínculo opcional</text><polyline points="1365,515 1365,630 1170,630 1170,750" fill="none" stroke="#000000" stroke-width="3"/><text x="1215" y="610" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">0..1 : 0..1</text><polyline points="235,875 235,1020" fill="none" stroke="#000000" stroke-width="3"/><text x="250" y="960" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N</text><polyline points="605,190 15,190 15,1100 40,1100" fill="none" stroke="#000000" stroke-width="3"/><text x="50" y="690" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N autor de reporte</text><rect x="605" y="85" width="390" height="127" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="607" y="87" width="386" height="47" fill="#ffffff"/><text x="621" y="120" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">USUARIOS</text><text x="621" y="166" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id</text><text x="621" y="197" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">Perfil y tipo de cuenta</text><rect x="40" y="360" width="390" height="127" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="42" y="362" width="386" height="47" fill="#ffffff"/><text x="56" y="395" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">SESIONES</text><text x="56" y="441" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK token · FK usuario_id</text><text x="56" y="472" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">csrf, vence</text><rect x="605" y="360" width="390" height="158" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="607" y="362" width="386" height="47" fill="#ffffff"/><text x="621" y="395" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">MENSAJES</text><text x="621" y="441" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id</text><text x="621" y="472" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">FK emisor_id, receptor_id</text><text x="621" y="503" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">cuerpo, creado</text><rect x="1170" y="360" width="390" height="158" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="1172" y="362" width="386" height="47" fill="#ffffff"/><text x="1186" y="395" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">CORREOS</text><text x="1186" y="441" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id · FK usuario_id</text><text x="1186" y="472" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">destinatario, estado</text><text x="1186" y="503" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">asunto, cuerpo, intentos</text><rect x="900" y="750" width="390" height="189" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="902" y="752" width="386" height="47" fill="#ffffff"/><text x="916" y="785" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">NOTIFICACIONES</text><text x="916" y="831" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id · FK usuario_id</text><text x="916" y="862" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">FK correo_id UNIQUE opcional</text><text x="916" y="893" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">FK mensaje_id opcional</text><text x="916" y="924" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">tipo, referencia, leida</text><rect x="40" y="750" width="390" height="127" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="42" y="752" width="386" height="47" fill="#ffffff"/><text x="56" y="785" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">RESEÑAS (ver otra vista)</text><text x="56" y="831" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id</text><text x="56" y="862" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">comentario, oculta</text><rect x="40" y="1020" width="390" height="158" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="42" y="1022" width="386" height="47" fill="#ffffff"/><text x="56" y="1055" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">REPORTES</text><text x="56" y="1101" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id · FK resena_id</text><text x="56" y="1132" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">FK autor_id</text><text x="56" y="1163" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">motivo, estado</text><text x="45" y="1249" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK identifica; FK relaciona. Atributos resumidos: consultar diccionario y DER completo editable.</text><text x="45" y="1276" font-family="Arial" font-size="18" font-weight="normal" fill="#000000">Las líneas indican cardinalidad, no el sentido de una acción. Usuarios se relaciona por distintos roles.</text></svg>