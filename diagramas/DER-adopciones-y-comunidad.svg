ight="normal" fill="#000000">PK identifica; FK relaciona. Atributos resumidos: consultar diccionario y DER completo editable.</text><text x="45" y="1041" font-family="Arial" font-size="18" font-weight="normal" fill="#000000">Las líneas indican cardinalidad, no el sentido de una acción. Usuarios se relaciona por distintos roles.</text></svg>