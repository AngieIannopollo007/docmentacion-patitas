idth="3"/><text x="1130" y="644" font-family="Arial" font-size="20" font-weight="normal" fill="#000000">1:N opcional</text><rect x="605" y="85" width="390" height="158" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="607" y="87" width="386" height="47" fill="#ffffff"/><text x="621" y="120" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">USUARIOS</text><text x="621" y="166" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id</text><text x="621" y="197" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">nombre, email, tipo</text><text x="621" y="228" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">foto, bienvenida</text><rect x="40" y="390" width="390" height="158" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="42" y="392" width="386" height="47" fill="#ffffff"/><text x="56" y="425" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">MASCOTAS</text><text x="56" y="471" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id · FK responsable_id</text><text x="56" y="502" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">nombre, estado</text><text x="56" y="533" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">foto, foto_extra</text><rect x="605" y="390" width="390" height="158" rx="12" fill="white" stroke="#000000" stroke-width="2"/><rect x="607" y="392" width="386" height="47" fill="#ffffff"/><text x="621" y="425" font-family="Arial" font-size="25" font-weight="bold" fill="#000000">SOLICITUDES</text><text x="621" y="471" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">PK id · FK mascota_id</text><text x="621" y="502" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">FK adoptante_id</text><text x="621" y="533" font-family="Arial" font-size="21" font-weight="normal" fill="#000000">formulario, estado</text><rect x="1170" y="39